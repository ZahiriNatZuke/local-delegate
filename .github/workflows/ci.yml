name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lo lanza el vigilante de precios sobre la rama de su PR (REQ-025): un PR abierto con
  # GITHUB_TOKEN no dispara `pull_request`.
  workflow_dispatch:

# Least privilege: CI solo lee el repo. Cualquier job que necesite más permisos los declara
# explícitamente (ver publish.yml, que pide `id-token: write` para OIDC).
permissions:
  contents: read

# Un run colgado no debe seguir ocupando sitio cuando ya se empujó el arreglo. En una rama de
# trabajo, el push nuevo cancela el anterior; en `main` NO, porque ahí cada commit ya está
# mergeado y su run es el registro de que ese estado pasó el CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ruff y el parser de JS dan el mismo veredicto en cualquier sistema: se corren una sola vez.
  # Lo que sí depende del SO son los tests, y por eso el job `test` va en matriz.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Check lockfile up-to-date
        run: uv lock --check

      - name: Sync deps
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Validate dashboard JS
        run: |
          uv run python scripts/extract_dashboard_js.py dashboard.js
          node --check dashboard.js

      # El panel **interactuado**, en un navegador de verdad: es la única capa que puede ver un
      # fallo de cableado (un `onclick` que no se registró, un id renombrado a medias, un botón
      # que no se deshabilita en la última página).
      #
      # Va DENTRO de este job y no en uno nuevo a propósito. Un job nuevo habría que declararlo
      # como check exigido en el ruleset, y este repo ya pagó una vez el precio de un check que
      # nadie reporta: bloquea el merge para siempre. `lint` ya es exigido, ya corre en ubuntu y
      # ya monta Node, así que aquí el navegador sale casi gratis.
      #
      # El módulo se salta solo donde no hay navegador, y por eso lleva dentro una guarda que
      # falla si se salta con CI=true: un test que se salta en todas partes es verde sobre cero
      # comprobaciones, que es un fallo que este repo ya cometió.
      - name: Install browser for the dashboard UI tests
        run: |
          uv sync --group dev --group ui
          uv run playwright install --with-deps chromium

      - name: Dashboard UI (Playwright)
        run: uv run pytest tests/test_dashboard_ui.py -q

  # El paquete es multiplataforma de verdad: rutas, locks entre procesos y las llamadas a la
  # API de Win32 (`_pid_alive` usa ctypes) se comportan distinto en cada sistema. La 0.11.0
  # arregló una fuga de handles que SOLO ocurría en Windows y que un CI de solo Ubuntu no
  # podía ver; esta matriz es lo que evita que vuelva.
  #
  # El `timeout-minutes` de aquí NO es decorativo, y su historia importa. Dos veces en dos días
  # (PR #77 y PR #86) `test (windows-latest)` se quedó en `in_progress` con TODOS sus pasos
  # terminados en `success` —incluido `Complete job`— y bloqueó el merge: 1954 s el primero, y el
  # segundo hasta que se canceló a mano. Los pasos reales tardan ~86 s y ningún otro run reciente
  # pasa de 125 s.
  #
  # El cuelgue es POSTERIOR a nuestro código: el runner terminó y lo que falta es que GitHub cierre
  # el job. Se descartó por ejecución un proceso huérfano reteniendo handles —el fallo clásico en
  # Windows—: la suite no deja procesos vivos.
  #
  # CORRECCIÓN del 2026-07-31: aquí ponía que `timeout-minutes` «no dispara» sobre el job
  # fantasma, deducido de ver el job más de 10 minutos vivo con el límite en 8 (PR #88). Ese
  # diagnóstico era falso, y la medición que lo tumba son los tres runs `cancelled` de `main` de
  # ese día (30652987094, 30654961990, 30660878897):
  #
  #   los tres murieron a los 13:00 EXACTOS desde el inicio del job
  #   y con estados internos distintos — dos con `Tests (pytest)` todavía `in_progress`,
  #   uno con TODOS los pasos en `success`, `Complete job` incluido (el fantasma puro)
  #
  # Trece minutos clavados con tres estados distintos solo lo explica un temporizador, no una
  # persona ni una coincidencia. Y 13 = 8 del límite + los 5 minutos de gracia que GitHub da al
  # runner para atender la cancelación antes de matarlo a la fuerza. Los «más de 10 minutos» que
  # se observaron eran ese periodo de gracia, no una prueba de que el límite no actuara.
  #
  # De ahí que la conclusión sea `cancelled` y no `timed_out`: un job que expira y cuyo runner no
  # responde lo cierra GitHub como cancelado.
  #
  # Consecuencia práctica: un `cancelled` en `main` que haya durado 20:00 (13:00 hasta el 2026-10-13,
  # ver la revisión de abajo) **no es una avería del
  # repo** — es este cuelgue de GitHub y el límite haciendo su trabajo. No bloquea nada, porque en
  # un push a `main` no hay merge esperando; en un PR sí lo bloquea, y ahí `ci-gate` da el
  # veredicto por los pasos.
  #
  # 8 y no más: son ~5,5x el peor caso observado (1 m 23 s en Windows), y el reloj corre sobre la
  # ejecución del job, no sobre la espera en cola.
  #
  # REVISIÓN del 2026-10-13: la suite creció (~2 500 tests) y el pytest de Windows ya tarda entre
  # 4 m 13 s y 4 m 58 s; ese día el límite de 5 del paso cortó tres corridas con CERO tests
  # fallidos (una en `main`, run 38407879259). Se sube a 10 el paso (~2x el peor caso nuevo) y a
  # 15 el job (paso + checkout, sync y el instalador e2e). Un cuelgue fantasma pasa a durar
  # 15 + 5 de gracia = 20:00 en vez de 13:00. Los tres `cancelled` de arriba son de cuando el
  # límite era 8.
  test:
    strategy:
      # Sin fail-fast: si un sistema falla interesa ver también qué hicieron los otros dos,
      # no quedarse a ciegas con el primero que cae.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Sync deps
        run: uv sync --group dev

      # Límite propio del paso, además del que gobierna el job entero. Cubre el caso en que quien
      # se cuelga es **pytest** y no el runner: en dos de los tres `cancelled` medidos el paso
      # seguía `in_progress` al morir el job. Con esto, ese cuelgue se corta a los 10 minutos y deja
      # un fallo con log, en vez de veinte minutos que además acaban sin log (`BlobNotFound`).
      #
      # 10 son ~2x el peor caso real en CI (4 m 58 s en Windows, 2026-10-13; antes 5 = 2,6x de 1,9 min). Si el que se cuelga es el runner, esto no
      # rescata —no hay proceso que matar— y manda el límite del job.
      #
      # En paralelo con `pytest-xdist`: casi todo el tiempo de la suite es espera (daemons como
      # subproceso, relojes reales, Playwright), no CPU. Medido en Windows local con 12 núcleos:
      # 4 min 23 s en serie, ~55 s con `-n auto` y 73 s con `-n 4`; 2565 tests en los tres casos.
      # `--dist loadgroup` respeta los `xdist_group` de los módulos que no aguantan el reparto
      # (los del panel con puertos fijos). Va aquí y no en `addopts` para no imponerlo en local.
      # Shells that the completion tests MUST run on each system (SDD cli-completion, REQ-037):
      # a required shell that is missing fails its tests, and the guard of `tests/conftest.py`
      # fails the run if none of its tests passed. An expression and not `matrix.include`, which
      # `tests/test_ci_gate.py` refuses; `tests/test_completion_ci_shells.py` pins the value.
      - name: Tests (pytest)
        timeout-minutes: 10
        env:
          COMPLETION_TEST_REQUIRE_SHELLS: ${{ matrix.os == 'windows-latest' && 'pwsh,powershell,bash' || matrix.os == 'macos-latest' && 'zsh,bash,bash3,pwsh' || 'bash,pwsh' }}
        run: uv run pytest -q -n auto --dist loadgroup

      # El instalador ejercido de verdad, y no solo sus funciones. Va en los tres sistemas porque
      # el punto del paso es justo ese: `install` escribe rutas, monta comandos de shell y decide
      # el intérprete según la plataforma, y de sus tres caminos **macOS no se había ejecutado
      # nunca** — el backlog lo tenía como «no auditable en esta máquina» dando por hecho que hacía
      # falta un Mac. Hacía falta un runner, y ya estaba en la matriz.
      #
      # Contra un HOME temporal y con `--no-client-cli`, que es el procedimiento que ya documenta
      # `scripts/dev/README.md`: sin eso, `claude mcp add-json --scope user` escribiría en el HOME
      # real del runner ignorando `--home`.
      #
      # Se instala **dos veces** a propósito: la idempotencia es la propiedad que más fácil se
      # rompe aquí, y una sola pasada no la vería. Y se comprueba que `uninstall` deja de verdad
      # el directorio como estaba, porque «reversible» está escrito en el docstring del módulo y
      # hasta ahora nadie lo ejercía de punta a punta en macOS.
      #
      # Desde el SDD cli-completion (REQ-039) el script añade la fase del autocompletado: siembra
      # perfiles, instala `--shell-completion` dos veces, completa en el shell real (PowerShell
      # 7 y 5.1, bash, zsh; en Linux también readline en un pty), hace el control del bloque sin
      # fichero y desinstala comparando los perfiles byte a byte. Por eso el límite sube de 3 a 6.
      - name: Instalador end-to-end contra un HOME temporal
        timeout-minutes: 6
        run: uv run python scripts/check_install_e2e.py

  # REQ-043: la suite no depende del idioma de la máquina. La corrida «en inglés» ya la da el
  # `test` de ubuntu (`LANG=C.UTF-8`); esta es la otra, con el sistema en español. Va una sola
  # vez, en ubuntu y con Python 3.11, porque es la suite ENTERA y es el coste grande: incluye el
  # panel con Playwright, que REQ-043 nombra expresamente y que con `CI=true` no puede saltarse.
  # En Windows `LANG` no decide el idioma (REQ-018 mira la interfaz), así que solo Linux discrimina.
  test-lang-es:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANG: es_ES.UTF-8
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      # Sin el locale generado, Python cae en `C` y el trabajo correría «en español» solo de nombre.
      - name: Generate the Spanish locale
        run: sudo locale-gen es_ES.UTF-8

      - name: Sync deps (with the ui group)
        run: uv sync --group dev --group ui

      - name: Install browser for the dashboard UI tests
        run: uv run playwright install --with-deps chromium

      # Guarda de «esto llegó a comprobar algo»: si el runner pisara `LANG` o pusiera `LC_ALL` o
      # `LC_MESSAGES` (que ganan a `LANG`), el trabajo saldría en verde sin estar en español.
      - name: Check the job really runs in Spanish
        run: >-
          python3 -c "import os;
          assert os.environ['LANG'] == 'es_ES.UTF-8', os.environ.get('LANG');
          assert not os.environ.get('LC_ALL'), os.environ.get('LC_ALL');
          assert not os.environ.get('LC_MESSAGES'), os.environ.get('LC_MESSAGES')"

      - name: Tests (pytest, LANG=es_ES.UTF-8)
        timeout-minutes: 10
        run: uv run pytest -q -n auto --dist loadgroup

  # D8 (frente B, ola B1a): el armazón de argparse («usage:», «options:», sus errores) se traduce
  # con los msgid del argparse del intérprete, y esos cambian entre versiones de Python. El paquete
  # admite cualquiera desde la 3.11 y `uv tool install` suele tomar la más nueva, así que los tests
  # del CLI corren en todas. Son pocos y sin Playwright: la matriz es barata aunque crezca.
  #
  # Cada celda figura por su nombre en `EXPECTED_JOBS` de `scripts/ci_gate.py`: todas bloquean. Nada
  # de `continue-on-error`: `ci_gate.py` da por mala toda conclusión que no sea success/skipped. Si
  # una versión futura sale sin wheels, la exclusión se reintroduce en `ci_gate.py` con su uso real.
  # `tests/test_ci_gate.py` ata esta lista a la de `ci_gate.py`. Una versión estable nueva se
  # añade en los dos sitios a la vez.
  cli-python-matrix:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Sync deps
        run: uv sync --group dev

      - name: CLI tests (pytest)
        timeout-minutes: 5
        run: >-
          uv run pytest -q tests/test_cli_english.py tests/test_retired_cli_names.py
          tests/test_completion_model.py tests/test_completion_render.py

  # El único job que NO usa `uv.lock`, y esa es exactamente su razón de ser.
  #
  # Los demás jobs instalan desde el lock, que fija versiones conocidas y buenas. Eso los protege
  # del fallo que sufre un usuario real, porque `uvx local-delegate-mcp` no ve el lock: resuelve
  # las dependencias contra el índice. El 2026-07-28 el SDK `mcp` publicó un major que elimina
  # `mcp.server.fastmcp` y la 0.12.1 —ya publicada— murió en el import en toda instalación nueva,
  # con el CI en verde todo el tiempo.
  #
  # Aquí se construye el wheel y se instala en un entorno limpio con resolución libre, igual que
  # haría `uvx`. `--refresh` y `--resolution highest` no son adorno: un entorno limpio no implica
  # caché limpia, y con una versión vieja cacheada este job pasaría siempre — sería un check
  # incapaz de fallar.
  install-smoke:
    runs-on: ubuntu-latest
    # El más holgado de los cuatro, y por una razón concreta: es el único que depende de PyPI
    # en vivo, donde un índice lento es una espera legítima y no un cuelgue.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Build del paquete
        run: uv build

      - name: Entorno limpio
        run: uv venv .venv-smoke

      - name: Instalar el wheel con resolución libre (sin lock)
        run: uv pip install --python .venv-smoke/bin/python --refresh --resolution highest dist/*.whl

      - name: Handshake MCP contra el paquete instalado
        run: .venv-smoke/bin/python scripts/check_install_handshake.py

      # REQ-036 (SDD cli-completion): las plantillas del autocompletado viajan en el wheel. El
      # binario instalado genera el script de los tres shells con la versión del wheel en la
      # cabecera (sacada del nombre del fichero, no de la misma metadata que la escribe), y bash
      # y pwsh completan con él `backend-params set ` hasta `mechanical`.
      - name: Autocompletado desde el paquete instalado
        timeout-minutes: 3
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/.venv-smoke/bin"
          wheel=$(basename "$(ls "$GITHUB_WORKSPACE"/dist/*.whl)")
          version=$(echo "$wheel" | cut -d- -f2)
          for shell in powershell bash zsh; do
            "$bin/local-delegate" completion "$shell" > "comp-$shell"
            if ! head -n 2 "comp-$shell" | grep -qF "# local-delegate $version completion $shell "; then
              echo "la cabecera de $shell no lleva la versión $version del wheel:"; head -n 2 "comp-$shell"
              exit 1
            fi
          done
          bash --norc --noprofile -c '
            . ./comp-bash
            COMP_WORDS=(local-delegate backend-params set ""); COMP_CWORD=3
            COMP_LINE="local-delegate backend-params set "; COMP_POINT=${#COMP_LINE}
            spec=$(complete -p local-delegate); func=${spec##*-F }; func=${func%% *}
            "$func" local-delegate "" set
            printf "%s\n" "${COMPREPLY[@]}"' > bash-reply
          grep -qx mechanical bash-reply || { echo "bash no completó mechanical:"; cat bash-reply; exit 1; }
          mv comp-powershell comp.ps1
          pwsh -NoProfile -NonInteractive -Command '. ./comp.ps1; $l = "local-delegate backend-params set "; (TabExpansion2 -inputScript $l -cursorColumn $l.Length).CompletionMatches.CompletionText' > pwsh-reply
          grep -qx mechanical pwsh-reply || { echo "pwsh no completó mechanical:"; cat pwsh-reply; exit 1; }
          echo "autocompletado del wheel $version: cabeceras de los tres shells, bash y pwsh completan mechanical"

  # El plugin de Claude Code que viaja en el paquete (SDD claude-plugin-and-mods, F1-package,
  # REQ-001..003), contra la CLI real en la versión mínima que soportamos y en los tres sistemas:
  # el motor de plugins es distinto por SO (rutas, shell) y la Mac lo usa. Sin sesión iniciada, `-p`
  # emite el evento `init` (con `plugins` y, si algo no cargó, `plugin_errors`) antes de pedir nada
  # a la API, así que se comprueba la carga sin gastar un turno ni necesitar credenciales.
  #
  # La CLI se instala con pnpm y `--ignore-scripts` (vía elegida en T0): no corre el `postinstall`,
  # el `bin/claude.exe` del paquete queda como stub y el binario nativo es el del paquete de la
  # plataforma. Socket, 2.1.292: el paquete base da supplyChain 92 y vulnerability 100; los binarios
  # por plataforma, quality 38 y license 50, por ser el binario propietario oficial. Solo corre
  # aquí: nunca viaja en el paquete.
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      CLAUDE_CODE_VERSION: "2.1.292"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.17.0"

      - name: Claude Code CLI (versión mínima, sin scripts de instalación)
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir cc && cd cc
          pnpm add --ignore-scripts --save-exact "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-x64 ;;
            macOS-ARM64) platform=darwin-arm64 ;;
            macOS-X64) platform=darwin-x64 ;;
            Windows-X64) platform=win32-x64 ;;
            *) echo "plataforma sin binario conocido: $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          dir="node_modules/.pnpm/@anthropic-ai+claude-code-$platform@$CLAUDE_CODE_VERSION/node_modules/@anthropic-ai/claude-code-$platform"
          bin="$PWD/$dir/claude"
          [ -f "$bin" ] || bin="$bin.exe"
          [ -f "$bin" ] || { echo "no está el binario nativo en $dir"; ls -la "$dir" || true; exit 1; }
          "$bin" --version | grep -qF "$CLAUDE_CODE_VERSION"
          echo "CLAUDE_BIN=$bin" >> "$GITHUB_ENV"
          echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude-config" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/claude-config"

      # F2-mod-core: `register.js` no se versiona; lo genera `build_mod.py` desde `mod/*.js`
      # (decisión 7). La rueda lo lleva por el hook de `hatch_build.py` (build-mod-in-build), pero
      # `validate` y `plugin test` miran el árbol de fuentes, que no pasa por un build: el editable
      # de `uv run` puede salir de la caché de uv sin ejecutar el hook. El script y el hook llaman
      # al mismo `build()`, así que el fichero es el mismo.
      - name: Construir register.js del mod
        run: uv run python scripts/build_mod.py

      - name: claude plugin validate --strict (marketplaces y plugin)
        run: |
          set -euo pipefail
          for target in . src/local_delegate/resources/claude-plugin src/local_delegate/resources/claude-plugin/local-delegate; do
            echo "== $target"
            "$CLAUDE_BIN" plugin validate --strict --json "$target"
          done

      # Control negativo del validador: un `hooks.json` roto tiene que hacerlo fallar, o el paso
      # anterior no estaría comprobando nada.
      - name: validate falla con un hooks.json roto
        run: |
          set -uo pipefail
          broken="$RUNNER_TEMP/broken-plugin"
          cp -R src/local_delegate/resources/claude-plugin/local-delegate "$broken"
          printf '{"hooks": {"UserPromptSubmit": [' > "$broken/hooks/hooks.json"
          if "$CLAUDE_BIN" plugin validate --strict --json "$broken"; then
            echo "validate aceptó un hooks.json roto"; exit 1
          fi

      # F2-mod-core: los `*.test.ts` del mod (pinned-tools, common, commands, status, read) contra el
      # motor de esta CLI. Se exige que corran los cinco ficheros y ninguno falle: un runner que no encuentra
      # tests también sale con 0.
      - name: claude plugin test (mod)
        run: |
          set -euo pipefail
          plugin=src/local_delegate/resources/claude-plugin/local-delegate
          "$CLAUDE_BIN" plugin test "$plugin" 2>&1 | tee "$RUNNER_TEMP/plugin-test.log"
          for file in pinned-tools common commands status read; do
            grep -q "$file.test.ts" "$RUNNER_TEMP/plugin-test.log" || { echo "no corrió $file.test.ts"; exit 1; }
          done
          grep -qE '^ *0 fail' "$RUNNER_TEMP/plugin-test.log"

      # Control negativo: con la pieza de tools fijas rota, `plugin test` tiene que fallar.
      - name: plugin test falla con el mod roto
        run: |
          set -uo pipefail
          broken="$RUNNER_TEMP/broken-mod"
          cp -R src/local_delegate/resources/claude-plugin/local-delegate "$broken"
          sed -i.bak 's/isDeferred: false/isDeferred: true/' "$broken/mod/pinned-tools.js"
          rm "$broken/mod/pinned-tools.js.bak"
          # `register.js` lleva las piezas pegadas: hay que regenerarlo en la copia.
          uv run python scripts/build_mod.py --plugin-dir "$broken"
          grep -q "isDeferred: true }" "$broken/register.js" || { echo "el mutante no llegó a register.js"; exit 1; }
          if "$CLAUDE_BIN" plugin test "$broken"; then
            echo "plugin test aceptó un mod que no fija ninguna tool"; exit 1
          fi

      # La rueda lleva el plugin. `uv build` sin `--wheel` construye el sdist y la rueda DESDE el
      # sdist, como PyPI y `uv tool install .`: el sdist no lleva `register.js` (`.gitignore`), así
      # que el de la rueda solo puede venir del hook de `hatch_build.py` (build-mod-in-build).
      - name: La rueda contiene el plugin
        run: |
          set -euo pipefail
          uv build --out-dir "$RUNNER_TEMP/dist"
          uv run --no-project python - "$RUNNER_TEMP/dist" <<'EOF'
          import glob, sys, tarfile, zipfile
          (sdist,) = glob.glob(sys.argv[1] + "/*.tar.gz")
          if any(n.endswith("/local-delegate/register.js") for n in tarfile.open(sdist).getnames()):
              sys.exit(f"{sdist} no debe llevar register.js: lo regenera el hook")
          (wheel,) = glob.glob(sys.argv[1] + "/*.whl")
          names = set(zipfile.ZipFile(wheel).namelist())
          base = "local_delegate/resources/claude-plugin/"
          need = [
              base + ".claude-plugin/marketplace.json",
              base + "local-delegate/.claude-plugin/plugin.json",
              base + "local-delegate/hooks/hooks.json",
              base + "local-delegate/register.js",
              base + "local-delegate/mod/common.js",
              base + "local-delegate/mod/pinned-tools.js",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit(f"faltan en {wheel}: {missing}")
          if any(n.startswith(base + "local-delegate/bin/") for n in names):
              sys.exit("la raíz del plugin no debe llevar bin/")
          register = zipfile.ZipFile(wheel).read(base + "local-delegate/register.js").decode()
          for piece in ("commands", "pinned_tools"):
              if f"register_{piece}(on, options)" not in register:
                  sys.exit(f"register.js de la rueda sin la pieza {piece}")
          print(f"{wheel}: plugin completo")
          EOF

      - name: Instalar en un CLAUDE_CONFIG_DIR vacío sin tocar ~/.claude/plugins
        run: |
          set -euo pipefail
          snapshot() { if [ -d "$HOME/.claude/plugins" ]; then (cd "$HOME/.claude/plugins" && find . | sort); else echo absent; fi; }
          snapshot > "$RUNNER_TEMP/real-before.txt"
          ld_bin="$(uv python find 3.11)"
          "$CLAUDE_BIN" plugin marketplace add "$GITHUB_WORKSPACE/src/local_delegate/resources/claude-plugin"
          "$CLAUDE_BIN" plugin install local-delegate@local-delegate --scope user \
            --config "ld_bin=$ld_bin" --config language=en --json | tee "$RUNNER_TEMP/install.json"
          grep -q '"outcome":"ok"' "$RUNNER_TEMP/install.json"
          "$CLAUDE_BIN" plugin list --json | tee "$RUNNER_TEMP/list.json"
          grep -q '"id": *"local-delegate@local-delegate"' "$RUNNER_TEMP/list.json"
          snapshot > "$RUNNER_TEMP/real-after.txt"
          diff "$RUNNER_TEMP/real-before.txt" "$RUNNER_TEMP/real-after.txt"
          [ -n "$(ls -A "$CLAUDE_CONFIG_DIR/plugins")" ]

      # `init` lista el plugin y no trae `plugin_errors`. Control negativo: el mismo comprobador
      # sobre el plugin con el `hooks.json` roto (por `--plugin-dir`) tiene que fallar.
      - name: La sesión carga el plugin sin errores (y no con un hooks.json roto)
        timeout-minutes: 4
        run: |
          set -uo pipefail
          cat > "$RUNNER_TEMP/check_init.py" <<'EOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              events = [json.loads(line) for line in f if line.strip()]
          init = next((e for e in events if e.get("subtype") == "init"), None)
          if init is None:
              sys.exit("no hay evento init")
          names = [p.get("name") for p in init.get("plugins", [])]
          errors = init.get("plugin_errors") or []
          if "local-delegate" not in names or errors:
              sys.exit(f"plugins={names} plugin_errors={errors}")
          print(f"init: plugins={names}, sin plugin_errors")
          EOF
          check="uv run --no-project python $RUNNER_TEMP/check_init.py"
          "$CLAUDE_BIN" -p "Reply OK" --max-turns 1 --output-format stream-json --verbose \
            > "$RUNNER_TEMP/good.jsonl" || true
          $check "$RUNNER_TEMP/good.jsonl" || exit 1
          mkdir -p "$RUNNER_TEMP/cfg-broken"
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/cfg-broken" "$CLAUDE_BIN" -p "Reply OK" --max-turns 1 \
            --plugin-dir "$RUNNER_TEMP/broken-plugin" --output-format stream-json --verbose \
            > "$RUNNER_TEMP/broken.jsonl" || true
          if $check "$RUNNER_TEMP/broken.jsonl"; then
            echo "el comprobador dio por bueno un plugin con hooks.json roto"; exit 1
          fi

      # F1-install: `install`/`uninstall` con plugin contra esta CLI, en un HOME simulado con su
      # propio CLAUDE_CONFIG_DIR (el script no toca el del runner): migración desde settings,
      # idempotencia, vuelta a settings, desinstalación y la orden de `hooks.json` para `prompt`.
      - name: install y uninstall con plugin en un HOME simulado
        timeout-minutes: 5
        run: uv run python scripts/check_plugin_install.py "$CLAUDE_BIN"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # El check que exige el ruleset, y el único de este workflow que lo exige por Windows.
  #
  # Por qué existe: GitHub deja a veces un job en `in_progress` PARA SIEMPRE con todos sus pasos
  # terminados en `success` —incluido el `Complete job` que pone el propio runner— y
  # `completed_at: null`. Le pasó tres veces en dos días a `test (windows-latest)` (PR #77, #86 y
  # #88) y, como los checks se exigen por nombre, el merge quedaba bloqueado hasta cancelar y
  # relanzar a mano. Es un problema conocido de GitHub sin solución oficial
  # (community/discussions/161434). Como los STEPS sí terminan, este job los mira por la API.
  #
  # OJO a las dos cosas que NO sirven, las dos comprobadas a base de equivocarse:
  #
  #   - `needs` + `if: always()`, que es el patrón habitual: `needs` espera a que el job TERMINE,
  #     que es exactamente lo que aquí no pasa. Este job corre en paralelo, sin `needs`.
  #   - `timeout-minutes` sobre el job colgado: lo aplica el runner sobre algo que sigue
  #     ejecutándose, y aquí el runner ya terminó. Medido en el PR #88: 10+ min con el límite en 8.
  #
  # Si el gate MISMO se colgara así, volveríamos al remedio de hoy (`gh run cancel` + `rerun`): no
  # se empeora nada respecto a la situación anterior. Corre en Ubuntu, donde el fallo no se ha visto.
  #
  # `actions: read` es todo lo que pide, y solo lee: nunca cancela ni relanza nada. Concederle
  # `actions: write` habría sido la otra vía, y se descartó por eso mismo.
  ci-gate:
    runs-on: ubuntu-latest
    # Cubre cola + ejecución del job más lento, no solo su ejecución: el script espera hasta 25 min.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      # Sin `setup-uv` a propósito: el script es solo stdlib, como `check_vendor.py`, así que no
      # hace falta resolver dependencias para decidir si la rama se puede mergear.
      - name: Veredicto por los steps de cada job
        run: python scripts/ci_gate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
