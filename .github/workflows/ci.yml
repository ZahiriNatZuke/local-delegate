name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI solo lee el repo. Cualquier job que necesite más permisos los declara
# explícitamente (ver publish.yml, que pide `id-token: write` para OIDC).
permissions:
  contents: read

# Un run colgado no debe seguir ocupando sitio cuando ya se empujó el arreglo. En una rama de
# trabajo, el push nuevo cancela el anterior; en `main` NO, porque ahí cada commit ya está
# mergeado y su run es el registro de que ese estado pasó el CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ruff y el parser de JS dan el mismo veredicto en cualquier sistema: se corren una sola vez.
  # Lo que sí depende del SO son los tests, y por eso el job `test` va en matriz.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Check lockfile up-to-date
        run: uv lock --check

      - name: Sync deps
        run: uv sync --group dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Validate dashboard JS
        run: |
          uv run python scripts/extract_dashboard_js.py dashboard.js
          node --check dashboard.js

  # El paquete es multiplataforma de verdad: rutas, locks entre procesos y las llamadas a la
  # API de Win32 (`_pid_alive` usa ctypes) se comportan distinto en cada sistema. La 0.11.0
  # arregló una fuga de handles que SOLO ocurría en Windows y que un CI de solo Ubuntu no
  # podía ver; esta matriz es lo que evita que vuelva.
  #
  # El `timeout-minutes` de aquí NO es decorativo, y su historia importa. Dos veces en dos días
  # (PR #77 y PR #86) `test (windows-latest)` se quedó en `in_progress` con TODOS sus pasos
  # terminados en `success` —incluido `Complete job`— y bloqueó el merge: 1954 s el primero, y el
  # segundo hasta que se canceló a mano. Los pasos reales tardan ~86 s y ningún otro run reciente
  # pasa de 125 s.
  #
  # El cuelgue es POSTERIOR a nuestro código: el runner terminó y lo que falta es que GitHub cierre
  # el job. Se descartó por ejecución un proceso huérfano reteniendo handles —el fallo clásico en
  # Windows—: la suite no deja procesos vivos.
  #
  # OJO, y esto se comprobó a base de equivocarse: `timeout-minutes` NO rescata de ese cuelgue.
  # Lo aplica el RUNNER sobre un job que sigue ejecutándose, y aquí el runner ya terminó — no hay
  # nada que matar. Medido en el PR #88: el job estuvo más de 10 minutos `in_progress` con este
  # límite en 8 y no disparó. Para el job fantasma sigue haciendo falta `gh run cancel` + `rerun`.
  #
  # Entonces, ¿para qué está? Para el otro modo de fallo, el que sí existe y este repo no cubría:
  # un job que de verdad se atasca EJECUTANDO (un test que no termina, una descarga que cuelga).
  # Ahí sin esto regirían las 6 HORAS del default de GitHub.
  #
  # 8 y no más: son ~5,5x el peor caso observado (1 m 23 s en Windows), y el reloj corre sobre la
  # ejecución del job, no sobre la espera en cola.
  test:
    strategy:
      # Sin fail-fast: si un sistema falla interesa ver también qué hicieron los otros dos,
      # no quedarse a ciegas con el primero que cae.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Sync deps
        run: uv sync --group dev

      - name: Tests (pytest)
        run: uv run pytest -q

  # El único job que NO usa `uv.lock`, y esa es exactamente su razón de ser.
  #
  # Los demás jobs instalan desde el lock, que fija versiones conocidas y buenas. Eso los protege
  # del fallo que sufre un usuario real, porque `uvx local-delegate-mcp` no ve el lock: resuelve
  # las dependencias contra el índice. El 2026-07-28 el SDK `mcp` publicó un major que elimina
  # `mcp.server.fastmcp` y la 0.12.1 —ya publicada— murió en el import en toda instalación nueva,
  # con el CI en verde todo el tiempo.
  #
  # Aquí se construye el wheel y se instala en un entorno limpio con resolución libre, igual que
  # haría `uvx`. `--refresh` y `--resolution highest` no son adorno: un entorno limpio no implica
  # caché limpia, y con una versión vieja cacheada este job pasaría siempre — sería un check
  # incapaz de fallar.
  install-smoke:
    runs-on: ubuntu-latest
    # El más holgado de los cuatro, y por una razón concreta: es el único que depende de PyPI
    # en vivo, donde un índice lento es una espera legítima y no un cuelgue.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Build del paquete
        run: uv build

      - name: Entorno limpio
        run: uv venv .venv-smoke

      - name: Instalar el wheel con resolución libre (sin lock)
        run: uv pip install --python .venv-smoke/bin/python --refresh --resolution highest dist/*.whl

      - name: Handshake MCP contra el paquete instalado
        run: .venv-smoke/bin/python scripts/check_install_handshake.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # El check que exige el ruleset, y el único de este workflow que lo exige por Windows.
  #
  # Por qué existe: GitHub deja a veces un job en `in_progress` PARA SIEMPRE con todos sus pasos
  # terminados en `success` —incluido el `Complete job` que pone el propio runner— y
  # `completed_at: null`. Le pasó tres veces en dos días a `test (windows-latest)` (PR #77, #86 y
  # #88) y, como los checks se exigen por nombre, el merge quedaba bloqueado hasta cancelar y
  # relanzar a mano. Es un problema conocido de GitHub sin solución oficial
  # (community/discussions/161434). Como los STEPS sí terminan, este job los mira por la API.
  #
  # OJO a las dos cosas que NO sirven, las dos comprobadas a base de equivocarse:
  #
  #   - `needs` + `if: always()`, que es el patrón habitual: `needs` espera a que el job TERMINE,
  #     que es exactamente lo que aquí no pasa. Este job corre en paralelo, sin `needs`.
  #   - `timeout-minutes` sobre el job colgado: lo aplica el runner sobre algo que sigue
  #     ejecutándose, y aquí el runner ya terminó. Medido en el PR #88: 10+ min con el límite en 8.
  #
  # Si el gate MISMO se colgara así, volveríamos al remedio de hoy (`gh run cancel` + `rerun`): no
  # se empeora nada respecto a la situación anterior. Corre en Ubuntu, donde el fallo no se ha visto.
  #
  # `actions: read` es todo lo que pide, y solo lee: nunca cancela ni relanza nada. Concederle
  # `actions: write` habría sido la otra vía, y se descartó por eso mismo.
  ci-gate:
    runs-on: ubuntu-latest
    # Cubre cola + ejecución del job más lento, no solo su ejecución: el script espera hasta 25 min.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      # Sin `setup-uv` a propósito: el script es solo stdlib, como `check_vendor.py`, así que no
      # hace falta resolver dependencias para decidir si la rama se puede mergear.
      - name: Veredicto por los steps de cada job
        run: python scripts/ci_gate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
